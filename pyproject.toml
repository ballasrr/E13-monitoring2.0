[project]
name = "e13-monitoring2-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ballasrr", email = "mrzipsru@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
# Чтобы `pytest` находил пакет app, запускаясь из корня проекта.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
