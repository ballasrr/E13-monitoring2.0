name: e13-monitoring

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Пока эта проверка не пройдёт, api не стартует —
      # иначе приложение упадёт, не дождавшись базы.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри сети Docker база зовётся по имени сервиса, а не по адресу.
      # Эта переменная перебивает значение из .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_ECHO: ${DB_ECHO:-false}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      STORAGE_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      FIRST_ADMIN_LOGIN: ${FIRST_ADMIN_LOGIN:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin12345}
    volumes:
      # Монтируем только исходники. Всю папку монтировать нельзя:
      # она перекрыла бы .venv, собранный внутри образа.
      - ./main.py:/app/main.py
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # Загруженные документы. Том, а не папка проекта: файлы
      # переживают пересборку образа и не лезут в git.
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
  uploads: